<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #2d3748;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #718096;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 15px;
            padding: 20px;
            background-color: #f8fafc;
            margin-bottom: 20px;
        }
        #image-preview {
            max-width: 100%;
            max-height: 240px;
            border-radius: 10px;
            display: none;
            margin: 0 auto 15px auto;
            object-fit: contain;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .placeholder-text {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 12px;
        }
        input[type="file"] {
            display: none;
        }
        .btn-upload {
            display: inline-block;
            background-color: #4f46e5;
            color: white;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }
        .btn-upload:hover {
            background-color: #4338ca;
        }
